name: Verify and Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  verify:
    name: Verify (install deps, compile, import check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system audio libraries
        # libsndfile is required by soundfile; without it "import soundfile" fails on a clean runner.
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all Python files
        run: python -m py_compile app.py verify.py

      - name: Run verify script (files, syntax, imports)
        run: python verify.py

  deploy:
    name: Deploy to Hugging Face Space
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: stphang
          HF_SPACE: MachineSoundClassifier
        run: |
          git remote add space "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE}" || true
          git push --force space HEAD:main
